        run: |
          set -e
          git config user.name "Emmanuella"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          while IFS='|' read -r day count; do
            [ -z "$day" ] && continue
            for n in $(seq 1 "$count"); do
              GIT_AUTHOR_DATE="$day 12:00:00 +0000" \
              GIT_COMMITTER_DATE="$day 12:00:00 +0000" \
              git commit --allow-empty -m "I AM EMMANUELLA • pixel $day" --no-gpg-sign
            done
          done <<< "$PIXELS"

          git push origin HEAD:main

      - name: Finish
        run: echo "I AM EMMANUELLA contribution artwork painted."
