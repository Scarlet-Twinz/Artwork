<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 180" role="img" aria-labelledby="title desc">
<title id="title">I AM EMMANUELLA pixel artwork</title>
<desc id="desc">A green pixel-art interpretation of the words I AM EMMANUELLA with floral sparkle accents.</desc>
<rect width="1040" height="180" rx="18" fill="#0d1117"/>
<g transform="translate(20 25)">
  <g fill="#39d353">
    <rect x="0" y="0" width="12" height="12"/><rect x="18" y="18" width="12" height="12"/><rect x="0" y="36" width="12" height="12"/>
  </g>
  <g transform="translate(70 8)" fill="#39d353" font-family="monospace" font-size="42" font-weight="700">
    <text x="0" y="52">I AM EMMANUELLA</text>
  </g>
  <g fill="#26a641">
    <rect x="0" y="118" width="12" height="12"/><rect x="18" y="100" width="12" height="12"/><rect x="36" y="118" width="12" height="12"/>
    <rect x="930" y="118" width="12" height="12"/><rect x="948" y="100" width="12" height="12"/><rect x="966" y="118" width="12" height="12"/>
  </g>
  <g fill="#58e06f" font-family="sans-serif" font-size="22">
    <text x="12" y="90">✦</text><text x="975" y="90">✿</text>
  </g>
</g>
</svg>